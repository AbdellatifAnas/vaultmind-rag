server:
  port: 8081

spring:
  application:
    name: vaultmind-rag
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:h2:mem:vaultmind_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  gemini:
    api-key: ${GEMINI_API_KEY:demo-mode}
    chat-model: gemini-2.5-flash
    embedding-model: text-embedding-004
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: llama3
  security:
    aes-key: ${ENCRYPTION_SECRET:MySuperSecretAESKey123456789012}
